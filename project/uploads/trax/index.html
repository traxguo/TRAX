<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>TRAX - Fitness Management</title>
  <meta name="theme-color" content="#0b0809" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TRAX" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    /* iOS installed PWA only: extend phone below the viewport so the bottom
       nav sits on the home indicator with no black gap. In a browser tab
       innerHeight is shrunk by the toolbars, which would make --phone-ext
       huge and push the nav up — so there we use 0 and rely on 100dvh. */
    (function(){
      var r = document.documentElement;
      var standalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
      if (standalone) {
        var h = window.screen.height + 60;
        r.style.setProperty('--phone-h', h + 'px');
        r.style.setProperty('--phone-ext', (h - window.innerHeight) + 'px');
        r.style.minHeight = h + 'px';
      } else {
        r.style.setProperty('--phone-ext', '0px');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
